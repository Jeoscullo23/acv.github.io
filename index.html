<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi novia ❤️</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #ffe6f2;
            text-align: center;
        }
        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 10;
        }
        .active {
            display: flex;
        }
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            margin: 15px;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background-color: #ff4d94;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .btn:hover {
            background-color: #ff1a75;
            transform: scale(1.05);
        }
        /* Estilos de títulos regulares */
        .title {
            font-size: 28px;
            color: #cc0052;
            margin-bottom: 20px;
            padding: 0 20px;
            font-weight: bold;
        }
        /* NUEVO: Estilo para celular, muy fácil de leer */
        .title-final {
            font-size: 32px;
            color: #ffffff; /* Letra blanca sólida */
            margin-bottom: 20px;
            padding: 0 20px;
            font-weight: 900;
            /* Borde fucsia oscuro alrededor de la letra para que resalte perfecto */
            text-shadow: 
                2px 2px 0px #b30047, 
                -2px -2px 0px #b30047, 
                2px -2px 0px #b30047, 
                -2px 2px 0px #b30047, 
                0px 6px 10px rgba(0,0,0,0.4);
        }
        .photo {
            width: 85%;
            max-width: 320px;
            border-radius: 15px;
            border: 6px solid #ff4d94;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
        /* Modal Error */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 300px;
        }
        .modal-content p {
            font-size: 22px;
            color: #cc0052;
            font-weight: bold;
            margin-bottom: 20px;
        }
        /* Corazones flotantes */
        .heart {
            position: absolute;
            color: #ff3385;
            font-size: 24px;
            animation: floatUp 5s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        /* Mundo 3D (CSS) */
        .world-container {
            width: 180px;
            height: 180px;
            position: absolute;
            z-index: 5;
            opacity: 0.3;
            top: 15%;
        }
        .world {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4da6ff, #0059b3);
            position: relative;
            overflow: hidden;
            box-shadow: inset -15px -15px 20px rgba(0,0,0,0.5), 0 0 20px rgba(77, 166, 255, 0.4);
            animation: spinWorld 8s linear infinite;
        }
        .continent {
            position: absolute;
            background: #33cc33;
            opacity: 0.85;
        }
        .c1 { width: 80px; height: 60px; top: 30px; left: 20px; border-radius: 40% 60% 50% 40%; }
        .c2 { width: 100px; height: 50px; bottom: 30px; right: 10px; border-radius: 50% 30% 60% 40%; }
        @keyframes spinWorld {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Modal de Error -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <p>¡Incorrecto! Vuelve a intentar 😒</p>
            <button class="btn" onclick="closeModal()">Reintentar</button>
        </div>
    </div>

    <!-- PANTALLA 1: Login -->
    <div id="screen1" class="screen active">
        <div class="title">¿QUIEN ES EL MAS LINDO BONITO HERMOSO DE LA RELACION?</div>
        <button class="btn" onclick="checkLogin('TU')">TÚ</button>
        <button class="btn" onclick="checkLogin('YO')">YO</button>
    </div>

    <!-- PANTALLA 2: Mensaje de Éxito -->
    <div id="screen2" class="screen">
        <div class="title">¡Correctoooooo! Tu novio es el más hermoso. ¡Qué suerte que tuviste! 🥰</div>
        <button class="btn" onclick="nextScreen(2, 3)">Siguiente Pregunta</button>
    </div>

    <!-- PANTALLA 3: Primera pregunta que se mueve -->
    <div id="screen3" class="screen">
        <div class="title">Si eres la más hermosa da al botón siguiente...</div>
        <button id="btnMove1" class="btn" onclick="moveButton('btnMove1', 3)">Siguiente</button>
    </div>

    <!-- PANTALLA 4: Segunda pregunta que se mueve (con mundo) -->
    <div id="screen4" class="screen">
        <div class="world-container">
            <div class="world">
                <div class="continent c1"></div>
                <div class="continent c2"></div>
            </div>
        </div>
        <div class="title">¿Eres la mejor novia del mundo mundial?</div>
        <button id="btnMove2" class="btn" onclick="moveButton('btnMove2', 4)">Siguiente</button>
    </div>

    <!-- PANTALLA 5: Final con Foto -->
    <div id="screen5" class="screen">
        <div class="title-final">Incorrecto !!! tu eres la novia mas feita</div>
        <img src="image_7550bc.jpg" alt="Foto" class="photo">
    </div>

    <script>
        // Crear corazones de fondo
        for(let i = 0; i < 20; i++){
            let h = document.createElement('div');
            h.innerHTML = '❤️';
            h.className = 'heart';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 4 + 3) + 's';
            h.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(h);
        }

        let moveCount1 = 0;
        let moveCount2 = 0;
        const MAX_MOVES = 3;

        function checkLogin(answer) {
            if(answer === 'YO') {
                document.getElementById('errorModal').style.display = 'flex';
            } else {
                nextScreen(1, 2);
            }
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        function nextScreen(current, next) {
            document.getElementById('screen' + current).classList.remove('active');
            document.getElementById('screen' + next).classList.add('active');
            
            // Si pasamos a las pantallas con botones que se mueven, resetear la posición
            if(next === 3 || next === 4) {
                let btnId = next === 3 ? 'btnMove1' : 'btnMove2';
                document.getElementById(btnId).style.transform = `translate(0px, 0px)`;
            }
        }

        function moveButton(btnId, screenNum) {
            let currentCount = screenNum === 3 ? moveCount1 : moveCount2;
            
            if (currentCount < MAX_MOVES) {
                let btn = document.getElementById(btnId);
                // Calcular espacio disponible en pantalla para que no se salga
                let maxX = window.innerWidth / 2 - 80;
                let maxY = window.innerHeight / 2 - 50;
                
                let randomX = (Math.random() * maxX * 2) - maxX;
                let randomY = (Math.random() * maxY * 2) - maxY;
                
                btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
                
                if (screenNum === 3) moveCount1++;
                else moveCount2++;
            } else {
                nextScreen(screenNum, screenNum + 1);
            }
        }
    </script>
</body>
</html>
